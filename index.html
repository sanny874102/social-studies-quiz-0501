<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小6上康軒自然 第一次段考線上測驗大題庫（含官方完整詳解）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6 my-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2 border-b pb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-teal-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-flask-vial"></i> 6上康軒自然 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：115國小6上康軒自然 第一次段考（已整合官方解答卷標準答案與完整詳解）</p>
        </div>

        <!-- 初始設定畫面 -->
        <div id="setup-screen" class="space-y-6">
            <div class="bg-teal-50/60 border border-teal-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-teal-600"></i> 選擇測驗題數（含完整題組不切題）：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[280px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫（共 156 題／題組）</option>
                    </select>
                </div>
                <div class="text-xs md:text-sm text-slate-500 flex items-start gap-2 pt-1">
                    <i class="fa-solid fa-circle-check text-teal-600 mt-1"></i>
                    <span><strong>官方解答與題組保護機制：</strong>所有題目均已對齊解答卷之標準答案與官方詳解，且「看圖分析、活用素養題、科學閱讀、實驗題組」皆以整組同頁方式呈現，隨機抽題時絕不切開子題！</span>
                </div>
            </div>

            <button onclick="startQuiz()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
                <span id="progress-text" class="text-slate-500 font-medium bg-slate-100 px-3 py-1 rounded-lg">第 1 / 10 題</span>
                <span id="score-text" class="text-teal-600 font-bold bg-teal-50 px-3 py-1 rounded-lg border border-teal-200">答對子題：0 / 0（目前得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-6">
                <!-- 動態載入單題或完整題組 -->
            </div>

            <!-- 單題詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 官方解答與觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base whitespace-pre-line"></p>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="resetQuiz()" class="px-4 py-2 text-slate-500 hover:text-slate-700 text-sm font-medium transition">
                    <i class="fa-solid fa-arrow-rotate-left mr-1"></i> 返回首頁重選
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-3">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-3xl font-extrabold text-teal-600"></p>
                <p id="final-detail" class="text-slate-600 text-base"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-teal-600"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('share-url');
            urlInput.value = window.location.href;
        });

        // ================= 115國小6上康軒自然 第一次段考 完整題庫（已整合官方解答卷詳解） =================
        const allQuestions = [
            // ---------------- 一、是非題 (單題 1~55) ----------------
            { type: "TF", q: "颱風通常都會帶來強風豪雨，尤其位處颱風眼中心通過的地區，風雨的威力會更強。", ans: false, explanation: "《答案》×\n詳解：颱風眼中心經過的地區，大都是無風無雨的天氣狀況。" },
            { type: "TF", q: "海水溫度的變化比陸地大，因此海洋無法調節氣溫的變化。", ans: false, explanation: "《答案》×\n詳解：海水溫度的變化比陸地小，因此海洋可以調節氣溫的變化。" },
            { type: "TF", q: "在兩個燒杯的重量一樣下，各自倒入相同的水量後，加入不同平匙數的食鹽，如果加入的食鹽都能完全溶解，則我們就無法判斷哪一杯水加入的食鹽平匙數較多。", ans: false, explanation: "《答案》×\n詳解：溶解的食鹽量越多，食鹽水溶液的重量越重，由此可以判別出哪一杯水加入的食鹽平匙數較多。" },
            { type: "TF", q: "選擇碳足跡較高的商品，是使地球環境永續發展的方法之一。", ans: false, explanation: "《答案》×\n詳解：應選擇碳足跡較低的商品。" },
            { type: "TF", q: "純水中有其他物質溶解，會導電。", ans: false, explanation: "《答案》×\n詳解：純水中沒有其他物質溶解，不會導電。" },
            { type: "TF", q: "檢驗水溶液酸鹼性時，若有未知的透明水溶液滴在紅色石蕊試紙上不變色，滴在藍色石蕊試紙上變紅色，則可以判斷這個透明水溶液是酸性水溶液。", ans: true, explanation: "《答案》○\n詳解：酸性水溶液的特性是使紅色石蕊試紙不變色，藍色石蕊試紙變紅色。" },
            { type: "TF", q: "在冬季，當臺灣受到來自大陸地區的冷氣團影響時，天氣會變得寒冷。", ans: true, explanation: "《答案》○\n詳解：臺灣冬季容易受到來自西伯利亞或蒙古地區的大陸冷氣團影響，天氣會變得寒冷。" },
            { type: "TF", q: "除了金屬能導電之外，有些水溶液也可以使電路形成通路，讓發光二極體發亮。", ans: true, explanation: "《答案》○\n詳解：除了金屬外，像食鹽水、醋、小蘇打水等水溶液也能使電路形成通路，讓發光二極體發亮。" },
            { type: "TF", q: "除了金屬能導電之外，有些水溶液也容易導電，讓發光二極體發亮。", ans: true, explanation: "《答案》○\n詳解：有些水溶液（如食鹽水、醋、小蘇打水）容易導電，能讓發光二極體發亮。" },
            { type: "TF", q: "酒精是一種水溶液，利用發光二極體測試，可以發現發光二極體會發亮，所以酒精具有導電性。", ans: false, explanation: "《答案》×\n詳解：酒精是一種水溶液，但酒精不易導電，所以利用發光二極體測試時，發光二極體不會發亮。" },
            { type: "TF", q: "大氣層中，溫室氣體的變化與氣候變遷沒有關係。", ans: false, explanation: "《答案》×\n詳解：溫室氣體的變化與氣候變遷有關，當溫室氣體增加，地球表面的溫度會升高，造成氣候變遷。" },
            { type: "TF", q: "小芳在地面天氣圖上發現「H」符號，表示這裡是圖中地勢最高、天氣最冷的地方。", ans: false, explanation: "《答案》×\n詳解：「H」符號在地面天氣圖上代表高氣壓中心的位置。" },
            { type: "TF", q: "將電池和電線連接發光二極體，如果發光二極體會發亮，形成通路，則我們可以利用這個裝置連接不同的水溶液，測試水溶液的導電性。", ans: true, explanation: "《答案》○\n詳解：先測試發光二極體能正常發亮形成通路後，即可用來連接不同水溶液測試其導電性。" },
            { type: "TF", q: "剛洗完手，手還潮溼時不可以碰觸插座，是因為自來水中溶解了其他物質，屬於一種容易導電的水溶液，可能會發生觸電危險。", ans: true, explanation: "《答案》○\n詳解：自來水中含有微量的礦物質等溶質，具有導電性，因此手溼碰觸插座容易導電而觸電。" },
            { type: "TF", q: "在紅、藍色石蕊試紙上各滴一滴氨水，兩張試紙的顏色都呈現藍色，表示氨水是鹼性水溶液。", ans: true, explanation: "《答案》○\n詳解：能使紅色石蕊試紙變藍色，但不會使藍色石蕊試紙變色（仍呈藍色），是鹼性水溶液。" },
            { type: "TF", q: "從冰箱裡拿出來的水果，放在桌上一段時間後，會看到水果表面有許多小水滴，這個現象和「露」的形成原因類似，都是因為空氣中的水蒸氣遇到較冷的物體，而在物體表面凝結成小水滴的緣故。", ans: true, explanation: "《答案》○\n詳解：兩種都是因為空氣中的水蒸氣遇到較冷的物體表面，而凝結成小水滴的現象。" },
            { type: "TF", q: "包括臺灣在內，世界各地都出現氣溫上升、極端降雨、降雨過少等極端天氣變化的現象。", ans: true, explanation: "《答案》○\n詳解：受到全球暖化與氣候變遷影響，世界各地皆出現極端天氣變化。" },
            { type: "TF", q: "將食鹽水、砂糖水和小蘇打水三種水溶液，分別滴在紅色石蕊試紙上，可以看到只有1張紅色石蕊試紙變色。", ans: true, explanation: "《答案》○\n詳解：食鹽水與砂糖水為中性（不變色），只有鹼性的小蘇打水會使紅色石蕊試紙變藍色。" },
            { type: "TF", q: "雨和雪最主要的差別在於，從空中降落到地面時，雨是液態的水，而雪是固態的冰晶。", ans: true, explanation: "《答案》○\n詳解：雨落下到地面時是液態水，雪落下到地面時是固態冰晶。" },
            { type: "TF", q: "有些植物具有顏色鮮豔的葉、花或果實，而且碰到酸鹼性水溶液時顏色會有規律變化，可以成為製作酸鹼指示劑的材料，例如蝶豆花。", ans: true, explanation: "《答案》○\n詳解：有些植物的葉、花或果實等部位富含花青素，可以作為自製酸鹼指示劑的材料。" },
            { type: "TF", q: "物質溶解在水中後，就無法再將物質從水中分離出來。", ans: false, explanation: "《答案》×\n詳解：可以利用加熱、日晒或放在通風處使水分蒸發，將溶解在水中的食鹽或砂糖分離出來。" },
            { type: "TF", q: "將水溶液中的水凝固後，可以使溶解在水中的物質分離出來。", ans: false, explanation: "《答案》×\n詳解：將水凝固成冰無法使溶解的物質分離出來，應透過「蒸發」水分的方式。" },
            { type: "TF", q: "根據颱風強度表（輕度：17.2~32.6公尺/每秒、中度：32.7~50.9公尺/每秒、強烈：≥51.0公尺/每秒），可以知道當颱風的近中心最大風速是每秒52公尺時，就會是強烈颱風。", ans: true, explanation: "《答案》○\n詳解：近中心最大風速達每秒 51.0 公尺以上即為強烈颱風。" },
            { type: "TF", q: "有些颱風來襲時，可以在衛星雲圖中看到颱風眼的位置，有些則沒有明顯的颱風眼。", ans: true, explanation: "《答案》○\n詳解：不是每個颱風都有明顯的颱風眼，強度較強的颱風較容易觀察到清晰的颱風眼。" },
            { type: "TF", q: "每年夏、秋兩季，臺灣經常有颱風侵襲，但颱風通常都不是在臺灣附近形成的。", ans: true, explanation: "《答案》○\n詳解：颱風通常是在熱帶海洋上形成，再移動到臺灣附近。" },
            { type: "TF", q: "小翔將醋和小蘇打水混合後，發現水溶液的酸鹼性沒有任何改變。", ans: false, explanation: "《答案》×\n詳解：醋是酸性水溶液，小蘇打水是鹼性水溶液，兩者互相混合後，酸鹼性會改變，根據混合的比例，有可能偏酸性、中性或鹼性。" },
            { type: "TF", q: "蝶豆花瓣汁液的顏色會隨著水溶液酸鹼性的不同，呈現規律性的變化，可以作為檢驗水溶液酸鹼性的指示劑。", ans: true, explanation: "《答案》○\n詳解：蝶豆花瓣汁加入酸性水溶液呈紫色、中性維持藍色、鹼性呈綠色，可作為酸鹼指示劑。" },
            { type: "TF", q: "雹是固態的冰粒，通常在對流旺盛的積雨雲中形成。", ans: true, explanation: "《答案》○\n詳解：雹通常在對流旺盛的積雨雲中形成，因為雲內空氣上下循環很快，會使降落的冰粒未完全融化就又被帶往高空，冰粒外圍的水會再次凝固，使冰粒越來越大而掉落地面，形成雹。" },
            { type: "TF", q: "增加溫室氣體排放，可以減緩地球暖化的現象。", ans: false, explanation: "《答案》×\n詳解：減少溫室氣體排放，可以減緩地球暖化的現象。" },
            { type: "TF", q: "環境溫度的改變，會使空氣中的水蒸氣產生各種形態變化，形成各種天氣現象。", ans: true, explanation: "《答案》○\n詳解：空氣中的水蒸氣隨環境溫度改變會形成雲、霧、雨、雪、露、霜等天氣現象。" },
            { type: "TF", q: "在鹼性的小蘇打水中滴入食鹽水後，混合後的水溶液會變成中性。", ans: false, explanation: "《答案》×\n詳解：食鹽水為中性，因此鹼性的小蘇打水和中性的食鹽水混合後，混合水溶液呈現鹼性。" },
            { type: "TF", q: "食鹽水是一種容易導電的水溶液，可以使發光二極體發亮，且放在通風處一段時間，會有白色物質產生。", ans: true, explanation: "《答案》○\n詳解：食鹽水容易導電，且水分蒸發後會留下白色的食鹽結晶。" },
            { type: "TF", q: "當地球暖化，水蒸氣變得更容易蒸發，空氣的對流現象會變得明顯。", ans: true, explanation: "《答案》○\n詳解：地球暖化使水蒸氣更容易蒸發，空氣對流更旺盛，容易造成極端降雨。" },
            { type: "TF", q: "食鹽和砂糖完全溶解在水中看不見以後，就無法用任何方法再將食鹽和砂糖取回。", ans: false, explanation: "《答案》×\n詳解：可以用晾晒或加熱等方式，讓水分蒸發，就能取回食鹽和砂糖。" },
            { type: "TF", q: "甲和乙兩種水溶液混合後，將蝶豆花瓣汁滴入混合水溶液中，變成偏紫色，表示混合水溶液是酸性水溶液。", ans: true, explanation: "《答案》○\n詳解：蝶豆花瓣汁遇到酸性水溶液會變成偏紫色。" },
            { type: "TF", q: "當空氣中的水蒸氣冷卻形成小水滴或冰晶時，如果飄浮在地面附近，就是霧；飄浮在空中，就是雲。", ans: true, explanation: "《答案》○\n詳解：雲和霧都是水蒸氣冷卻形成的小水滴或冰晶，飄浮在地面附近是霧，飄浮在空中是雲。" },
            { type: "TF", q: "地面天氣圖中，等壓線是將氣壓數值相同的點連起來，通常形成一條條開放的直線。", ans: false, explanation: "《答案》×\n詳解：等壓線繪製完成後應為封閉曲線。" },
            { type: "TF", q: "自備購物袋和使用環保餐具會增加碳足跡，無法幫助地球永續發展。", ans: false, explanation: "《答案》×\n詳解：自備購物袋和使用環保餐具是減少碳足跡的行動，可以幫助地球永續發展。" },
            { type: "TF", q: "進行「水溶液的導電性」實驗，純水因為沒有其他物質溶解在其中，不會導電，因此適合用來作為實驗中的「對照組」。", ans: true, explanation: "《答案》○\n詳解：純水不含其他溶質，不會導電，以此作為對照組，可以觀察加入其他溶質（形成實驗組）後是否改變導電的性質。" },
            { type: "TF", q: "近100多年來，空氣中二氧化碳濃度變高，全世界氣溫也持續上升，二氧化碳濃度會影響全世界的氣溫。", ans: true, explanation: "《答案》○\n詳解：二氧化碳是溫室氣體，濃度升高會使全球平均氣溫跟著上升。" },
            { type: "TF", q: "將砂糖水連接到電路中，可以使發光二極體發亮，表示砂糖水是中性水溶液。", ans: false, explanation: "《答案》×\n詳解：砂糖水不易導電，無法使發光二極體發亮。" },
            { type: "TF", q: "如果想要測試水溶液的導電性，將「電池正極出來的電線放入燒杯，電池負極出來的電線卻接在發光二極體的長腳端（短腳端接燒杯）」，這種連接方式是正確的。（是非題第 42 題）", ans: false, explanation: "《答案》×\n詳解：發光二極體的長腳端要接在由電池正極出來的電線上，短腳端要接在由電池負極出來的電線上，且電池盒須通電。" },
            { type: "TF", q: "如果衛星雲圖上某地區被白色的雲層籠罩，表示當地的天氣狀況晴朗炎熱。", ans: false, explanation: "《答案》×\n詳解：衛星雲圖上被白色雲層籠罩的區域，代表該區域上空有雲，天氣狀況較有可能是陰天或下雨。" },
            { type: "TF", q: "氣象預報「週三之後，隨著鋒面往南移動，臺灣地區的降雨將會逐漸趨緩」，報告中提到的「鋒面」是指冷、暖氣團互相接觸影響的地方。", ans: true, explanation: "《答案》○\n詳解：鋒面是指冷、暖氣團交會時，暖空氣中的水蒸氣遇到冷空氣凝結成小水滴，沿著交界面形成的一條雲帶。" },
            { type: "TF", q: "大氣中能夠吸收熱能的氣體，例如二氧化碳、水蒸氣和甲烷等，稱為溫室氣體。", ans: true, explanation: "《答案》○\n詳解：大氣中能夠吸收熱能的氣體，例如二氧化碳、水蒸氣、甲烷、氧化亞氮和氟氯碳化物等，稱為溫室氣體，能產生溫室效應。" },
            { type: "TF", q: "氣候變遷可能會造成一些問題，例如極端降雨使水庫淤積大量土石。", ans: true, explanation: "《答案》○\n詳解：極端降雨容易沖刷山坡土石，造成水庫大量淤積。" },
            { type: "TF", q: "生產食物的過程會用到許多水資源，因此避免浪費食物可以減少水足跡。", ans: true, explanation: "《答案》○\n詳解：避免浪費食物可以減少食物生產過程所消耗的水足跡。" },
            { type: "TF", q: "天空中的雲是風把水蒸氣吹聚在一起所形成的現象。", ans: false, explanation: "《答案》×\n詳解：天空中的雲是水蒸氣在上升的過程中，附著在微小顆粒上，再凝結成細小的水滴或直接變成冰晶，飄浮在空中的現象。" },
            { type: "TF", q: "暖氣團減弱、冷氣團增強的冬季是滯留鋒容易出現的季節。", ans: false, explanation: "《答案》×\n詳解：滯留鋒容易出現在每年五、六月，暖氣團和冷氣團勢均力敵的時候。" },
            { type: "TF", q: "水可以溶解許多物質，但只能溶解固體。", ans: false, explanation: "《答案》×\n詳解：水也可以溶解液體和氣體。" },
            { type: "TF", q: "觀察完水溶液的導電性後，應切換開關形成斷路，以免發光二極體燒壞。", ans: true, explanation: "《答案》○\n詳解：觀察完應切換開關形成斷路，避免發光二極體損壞。" },
            { type: "TF", q: "有些水溶液具有導電性，不易使發光二極體發亮；有些水溶液則不具有導電性，容易使發光二極體發亮。", ans: false, explanation: "《答案》×\n詳解：具有導電性的水溶液「容易」使發光二極體發亮；不具導電性的水溶液則「不易」使發光二極體發亮。" },
            { type: "TF", q: "檢驗小蘇打水的酸鹼性時，藍色石蕊試紙會變成紅色，紅色石蕊試紙會變成藍色。", ans: false, explanation: "《答案》×\n詳解：小蘇打水是鹼性水溶液，滴在藍色石蕊試紙上不會變色，滴在紅色石蕊試紙上會變藍色。" },
            { type: "TF", q: "食鹽顆粒不易導電，但食鹽水容易導電。", ans: true, explanation: "《答案》○\n詳解：食鹽顆粒本身不易導電，但完全溶解於水中，變成食鹽水後容易導電。" },
            { type: "TF", q: "測試水溶液導電性的實驗中，醋、食鹽水、砂糖水等水溶液，都容易讓發光二極體發亮。", ans: false, explanation: "《答案》×\n詳解：醋、食鹽水等水溶液都容易導電，使發光二極體發亮；砂糖水則不容易導電。" },

            // ---------------- 二、選擇題 (單題 1~55) ----------------

            { type: "MC", q: "小妍想要購買蘋果來做蘋果派，下列哪一種行為無法有效減少碳足跡？", options: ["自備購物袋選購蘋果", "購買美國進口的蘋果", "購買在地出產的蘋果", "吃不完的蘋果派用環保保鮮盒密封放冰箱冷藏，不直接丟棄"], ans: 1, explanation: "《答案》② 購買美國進口的蘋果\n詳解：購買國外進口的蘋果需要長途運輸，會產生較多的碳足跡。" },

            { type: "MC", q: "當購買下列哪一項食物時，所產生碳足跡最大？", options: ["美國出產的櫻桃", "高雄出產的芭樂", "雲林出產的柳橙", "臺南出產的絲瓜"], ans: 0, explanation: "《答案》① 美國出產的櫻桃\n詳解：跨國進口的農產品運輸距離最遠，產生的碳足跡最大。" },

            { type: "MC", q: "測試水溶液的導電性時，發光二極體的短腳端應如何連接？", options: ["與電池正極連接", "與電池負極連接", "與電池的正極或負極連接", "與發光二極體的長腳端連接"], ans: 1, explanation: "《答案》② 與電池負極連接\n詳解：發光二極體的長腳端接正極，短腳端接負極。" },
            { type: "MC", q: "下列關於「颱風眼」的敘述，何者不正確？", options: ["颱風眼位於颱風的中心", "颱風眼區域通常無雲", "颱風眼通過區域大都呈現狂風驟雨的天氣狀況", "不是每個颱風都有明顯的颱風眼"], ans: 2, explanation: "《答案》③ 颱風眼通過區域大都呈現狂風驟雨的天氣狀況\n詳解：颱風眼中心經過的地區，大都是無風無雨的天氣狀況。" },

            { type: "MC", q: "家凱對於大氣中雲層分布的變化情形很有興趣，他應該去觀察下列哪一種氣象圖表？", options: ["降雨機率表", "各地一週天氣預報", "連續幾天的地面天氣圖", "連續幾天的衛星雲圖"], ans: 3, explanation: "《答案》④ 連續幾天的衛星雲圖\n詳解：衛星雲圖能觀察大氣中雲層的分布與變化情形。" },
            { type: "MC", q: "下列哪一項是將水溶液中的物質分離出來的例子？", options: ["透過熬煮甘蔗汁，製作紅糖", "將砂糖倒入水中，製作砂糖水", "將水倒入太鹹的湯", "將水放置冷凍庫，製作冰塊"], ans: 0, explanation: "《答案》① 透過熬煮甘蔗汁，製作紅糖\n詳解：熬煮甘蔗汁是利用加熱讓水分蒸發，將溶解在水中的糖分離出來。" },
            { type: "MC", q: "下列哪一個不是酸性水溶液和鹼性水溶液互相作用後變成中性水溶液的生活應用？", options: ["胃酸過多時吃胃藥", "用酸性清潔劑清洗熱水瓶內的水垢", "在冰淇淋上淋草莓果醬", "在酸化的土壤上撒石灰粉"], ans: 2, explanation: "《答案》③ 在冰淇淋上淋草莓果醬\n詳解：「在冰淇淋上淋草莓果醬」只有增加口感，並未產生酸和鹼作用，改變冰淇淋原來的酸鹼性質。" },

            { type: "MC", q: "如果將砂糖水放在通風的地方，經過一段時間後，發現沒有水了，只剩下砂糖顆粒，這是什麼現象造成的？", options: ["凝結", "融化", "凝固", "蒸發"], ans: 3, explanation: "《答案》④ 蒸發\n詳解：砂糖水中分離出砂糖，是因為水分「蒸發」而造成的。" },

                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            updateHeaderStatus();
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function checkSubAnswer(subIdx, userAnswer, btnElement) {
            const buttons = document.querySelectorAll(`.sub-btn-${subIdx}`);
            if (buttons[0].disabled) return;
            buttons.forEach(btn => btn.disabled = true);

            currentItemAnsweredCount++;
            totalSubQuestionsAnswered++;

            const qData = currentQuizQuestions[currentIndex];
            const subQ = qData.subQuestions[subIdx];
            const isCorrect = (userAnswer === subQ.ans);

            if (isCorrect) {
                totalSubQuestionsCorrect++;
                btnElement.classList.remove('bg-white', 'hover:bg-teal-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-white', 'hover:bg-teal-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (idx === subQ.ans) {
                        btn.classList.remove('bg-white');
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                    }
                });
            }

            document.getElementById(`sub-exp-${subIdx}`).classList.remove('hidden');
            updateHeaderStatus();

            if (currentItemAnsweredCount >= currentItemTotalSub) {
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${getCurrentScore()} 分`;
                document.getElementById('final-detail').innerText = `共挑戰 ${currentQuizQuestions.length} 題（含題組共 ${totalSubQuestionsInQuiz} 小題），答對 ${totalSubQuestionsCorrect} 小題`;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('測驗網址已成功複製！');
        }
    </script>
</body>
</html>
